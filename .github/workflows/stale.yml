name: Stale Issues & PRs

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          
          # Issues
          stale-issue-message: |
            This issue has been marked as inactive because there has been no activity for 60 days.
            It will be automatically closed in 7 days if no further activity occurs.
            
            If you believe this issue is still relevant, please comment here to keep it open.
          close-issue-message: |
            This issue has been automatically closed due to inactivity.
            It can be reopened at any time if needed.
          days-before-issue-stale: 60
          days-before-issue-close: 7
          stale-issue-label: stale
          exempt-issue-labels: 'pinned,security,bug,critical,priority: critical,priority: high'
          
          # Pull Requests
          stale-pr-message: |
            This pull request has been marked as inactive because there has been no activity for 30 days.
            It will be automatically closed in 7 days if no further activity occurs.
            
            Please update the PR if it is still relevant.
          close-pr-message: |
            This pull request has been automatically closed due to inactivity.
            It can be reopened at any time if needed.
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-pr-label: stale
          exempt-pr-labels: 'pinned,security,in-progress,work-in-progress'
