name: Copilot PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  copilot-suggestions:
    name: Copilot Suggestions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run linting and collect suggestions
        run: |
          ruff check custom_components/ tests/ --output-format=json > ruff_output.json || [[ $? -eq 1 ]]

      - name: Upload lint suggestions
        uses: actions/upload-artifact@v7
        with:
          name: copilot-lint-suggestions
          path: ruff_output.json
          retention-days: 1
          if-no-files-found: error
