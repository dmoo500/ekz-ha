name: Copilot PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  copilot-review:
    name: Copilot Code Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: pr-diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt

      - name: Copilot PR Summary
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const diff = fs.readFileSync('pr_diff.txt', 'utf8');

            // Comment with diff summary
            const comment = `## 🤖 Copilot PR Summary

            This PR modifies the following areas:

            ${diff.split('\n')
              .filter(line => line.startsWith('diff --git'))
              .map(line => {
                const file = line.split(' b/')[1];
                return \`- \${file}\`;
              })
              .join('\n')}

            **Review checklist:**
            - [ ] Code follows project style guidelines
            - [ ] Tests are included for new functionality
            - [ ] Documentation is updated
            - [ ] No breaking changes (or properly documented)
            - [ ] Performance impact considered
            `;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(
              comment => comment.user.login === 'github-actions[bot]' &&
                         comment.body.includes('🤖 Copilot PR Summary')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

  copilot-suggestions:
    name: Copilot Suggestions
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run linting and collect suggestions
        id: lint
        run: |
          ruff check custom_components/ tests/ --output-format=json > ruff_output.json || true
        continue-on-error: true

      - name: Post suggestions as review comments
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            try {
              const ruffOutput = fs.readFileSync('ruff_output.json', 'utf8');
              const issues = JSON.parse(ruffOutput);

              if (issues.length > 0) {
                let comment = '## 🔍 Code Quality Suggestions\n\n';
                comment += 'The following issues were found:\n\n';

                issues.slice(0, 10).forEach(issue => {
                  comment += \`- **\${issue.code}** in \${issue.filename}:\${issue.location.row}: \${issue.message}\n\`;
                });

                if (issues.length > 10) {
                  comment += \`\n... and \${issues.length - 10} more issues.\n\`;
                }

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: comment
                });
              }
            } catch (error) {
              console.log('No linting issues found or error parsing output');
            }
