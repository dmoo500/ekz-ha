name: Auto Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  issues:
    types: [opened, edited]

jobs:
  label-pr:
    name: Label Pull Request
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Label based on files
        uses: actions/labeler@v7
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml

      - name: Label based on PR content
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const title = pr.title || '';
            const labels = [];

            const categories = [
              'bugfix', 'feature', 'enhancement', 'breaking-change',
              'documentation', 'maintenance', 'ci', 'dependencies',
            ];
            const selected = [...body.matchAll(/^- \[[xX]\].*`(type: [a-z-]+)`\s*$/gm)]
              .map(match => match[1]);
            const valid = selected.length === 1 &&
              categories.includes(selected[0].slice('type: '.length));
            if (valid) labels.push(selected[0]);

            // Add size label based on changes
            const changedFiles = pr.changed_files;
            const additions = pr.additions;
            const deletions = pr.deletions;
            const totalChanges = additions + deletions;

            if (totalChanges < 10) labels.push('size/XS');
            else if (totalChanges < 50) labels.push('size/S');
            else if (totalChanges < 200) labels.push('size/M');
            else if (totalChanges < 500) labels.push('size/L');
            else labels.push('size/XL');

            const currentLabels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
            });
            for (const label of currentLabels) {
              if ((label.name.startsWith('size/') || label.name.startsWith('type: ')) &&
                  !labels.includes(label.name)) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  name: label.name,
                });
              }
            }

            // Apply labels
            if (labels.length > 0) {
              for (const name of labels.filter(name => name.startsWith('type: '))) {
                try {
                  await github.rest.issues.getLabel({
                    owner: context.repo.owner, repo: context.repo.repo, name,
                  });
                } catch (error) {
                  if (error.status !== 404) throw error;
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner, repo: context.repo.repo, name,
                    color: '1D76DB',
                    description: 'PR category used to group release notes',
                  });
                }
              }
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: labels
              });
            }
            if (!valid) {
              core.setFailed('Select exactly one Type of change checkbox in the PR template.');
            }

  label-issue:
    name: Label Issue
    runs-on: ubuntu-latest
    if: github.event_name == 'issues'
    permissions:
      issues: write
    steps:
      - name: Label based on issue content
        uses: actions/github-script@v9
        with:
          script: |
            const issue = context.payload.issue;
            const title = issue.title || '';
            const body = issue.body || '';
            const labels = [];

            // Auto-detect from title
            if (title.toLowerCase().includes('[bug]')) labels.push('bug');
            if (title.toLowerCase().includes('[feature]')) labels.push('enhancement');
            if (title.toLowerCase().includes('production')) labels.push('production');
            if (title.toLowerCase().includes('consumption')) labels.push('consumption');
            if (title.toLowerCase().includes('statistics')) labels.push('statistics');

            // Auto-detect priority
            if (title.toLowerCase().includes('critical') || body.toLowerCase().includes('critical')) {
              labels.push('priority: critical');
            } else if (title.toLowerCase().includes('urgent')) {
              labels.push('priority: high');
            }

            // Apply labels
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: labels
              });
            }
