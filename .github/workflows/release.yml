name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'           # Stable: 0.2.0
      - '[0-9]+.[0-9]+.[0-9]+-*'         # Pre-release with dash: 0.2.0-alpha.1
      - '[0-9]+.[0-9]+.[0-9]+a[0-9]+'    # PEP 440 alpha: 0.2.0a1
      - '[0-9]+.[0-9]+.[0-9]+b[0-9]+'    # PEP 440 beta: 0.2.0b1
      - '[0-9]+.[0-9]+.[0-9]+rc[0-9]+'   # PEP 440 rc: 0.2.0rc1

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate tag format (no 'v' prefix)
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          if [[ $TAG_NAME =~ ^v ]]; then
            echo "❌ ERROR: Tag '$TAG_NAME' starts with 'v'"
            echo "This project uses tags WITHOUT 'v' prefix"
            echo "Correct format: 0.2.0-alpha.1 (not v0.2.0-alpha.1)"
            echo "See CONTRIBUTING.md for details"
            exit 1
          fi
          echo "✓ Tag format is correct: $TAG_NAME"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Validate version consistency
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/}
          MANIFEST_VERSION=$(python -c "import json; print(json.load(open('custom_components/ekz_ha/manifest.json'))['version'])")
          PACKAGE_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")

          echo "Tag version: $TAG_VERSION"
          echo "Manifest version: $MANIFEST_VERSION"
          echo "Package version: $PACKAGE_VERSION"

          if [[ "$TAG_VERSION" != "$MANIFEST_VERSION" || "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "❌ Version mismatch!"
            exit 1
          fi

          echo "✓ Versions match"

  release:
    name: Create Release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect pre-release
        id: prerelease
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          # Check for PEP 440 pre-release formats (a, b, rc) or dash formats (alpha, beta, rc)
          if [[ $TAG_NAME =~ (a|b|rc)[0-9]+$ ]] || [[ $TAG_NAME =~ -(alpha|beta|rc) ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "✓ Detected pre-release version: $TAG_NAME"
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "✓ Detected stable release: $TAG_NAME"
          fi

      - name: Write release notes
        uses: actions/github-script@v9
        env:
          IS_PRERELEASE: ${{ steps.prerelease.outputs.is_prerelease }}
        with:
          script: |
            const fs = require('node:fs');
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            let notes;
            if (process.env.IS_PRERELEASE === 'true') {
              const prs = await github.paginate(
                github.rest.repos.listPullRequestsAssociatedWithCommit,
                { ...repo, commit_sha: context.sha },
              );
              const candidates = prs.filter(pr => pr.state === 'open' && pr.head.sha === context.sha);
              if (candidates.length !== 1) {
                throw new Error('A beta needs exactly one open PR at this commit with a Release note section.');
              }
              const pr = candidates[0];
              const section = (pr.body || '').split(/^## Release note[ \t]*\r?$/m)[1]
                ?.split(/^## /m)[0];
              const summary = section?.replace(/<!--[\s\S]*?-->/g, '').trim();
              if (!summary) {
                throw new Error(`Add a user-facing Release note to PR #${pr.number} before publishing a beta.`);
              }
              notes = `${summary}\n\nThis is a beta release. See [the changes](${pr.html_url}).\n`;
            } else {
              const response = await github.rest.repos.generateReleaseNotes({
                ...repo, tag_name: context.ref.replace('refs/tags/', ''),
                target_commitish: context.sha,
                configuration_file_path: '.github/release.yml',
              });
              notes = response.data.body;
            }
            fs.writeFileSync('RELEASE_NOTES.md', notes);

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ steps.prerelease.outputs.is_prerelease == 'true' }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify on success
        if: success()
        run: |
          echo "✅ Release ${{ github.ref_name }} created successfully!"
