name: 🐛 Bug Report
description: Melde einen Bug oder ein Problem
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Danke für deine Bug-Meldung! Bitte fülle die folgenden Felder so detailliert wie möglich aus.
        
  - type: textarea
    id: description
    attributes:
      label: Beschreibung des Problems
      description: Eine klare und präzise Beschreibung des Problems
      placeholder: Was ist passiert?
    validations:
      required: true
      
  - type: textarea
    id: steps
    attributes:
      label: Schritte zur Reproduktion
      description: Schritte um das Problem zu reproduzieren
      placeholder: |
        1. Gehe zu '...'
        2. Klicke auf '...'
        3. Scrolle runter zu '...'
        4. Siehe Fehler
    validations:
      required: true
      
  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Verhalten
      description: Was sollte stattdessen passieren?
      placeholder: Beschreibe was du erwartet hast
    validations:
      required: true
      
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevante Log-Auszüge (falls vorhanden)
      placeholder: |
        Füge Home Assistant Logs hier ein
      render: shell
      
  - type: input
    id: version
    attributes:
      label: EKZ Integration Version
      description: Welche Version der Integration verwendest du?
      placeholder: z.B. 0.2.0-alpha.1
    validations:
      required: true
      
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant Version
      description: Welche Home Assistant Version verwendest du?
      placeholder: z.B. 2024.8.0
    validations:
      required: true
      
  - type: textarea
    id: additional
    attributes:
      label: Zusätzlicher Kontext
      description: Weitere Informationen die hilfreich sein könnten
      placeholder: Screenshots, Konfiguration, etc.
