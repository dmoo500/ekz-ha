name: ✨ Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for your feature suggestion!

  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: Is there a problem that should be solved? Describe it.
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you solve the problem?
      placeholder: Describe your idea
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions
      description: Have you considered other approaches?
      placeholder: Alternative approaches...

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Other information that might be helpful
      placeholder: Screenshots, links, etc.
